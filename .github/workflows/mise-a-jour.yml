name: Mise à jour des programmes

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger et convertir le guide TV
        run: python scripts/convert.py
      - name: Enregistrer
        run: |
          git config user.name "tele-du-soir"
          git config user.email "actions@users.noreply.github.com"
          git add data/programmes.json
          git diff --cached --quiet || git commit -m "Programmes du $(date +'%d/%m/%Y %H:%M')"
          git push
